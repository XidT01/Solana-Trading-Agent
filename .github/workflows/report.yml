name: Daily report

on:
  schedule:
    - cron: "20 23 * * *"   # 23:20 UTC, after the peak window closes
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date (YYYY-MM-DD), default today"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: agent-data
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m agent.report ${{ inputs.date && format('--date {0} --force', inputs.date) || '' }}
      - name: Commit report
        run: |
          git config user.name "wallet-agent"
          git config user.email "wallet-agent@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "report $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

  deploy:
    needs: report
    uses: ./.github/workflows/deploy.yml
