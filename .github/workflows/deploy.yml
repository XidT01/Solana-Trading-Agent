name: Deploy website

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages_try.outputs.page_url || steps.pages_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}   # include the data just pushed
      - name: Assemble site
        run: |
          mkdir -p public
          cp -r site/. public/
          cp -r data public/data
          rm -f public/data/seen.json public/data/watchlist.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      # GitHub sometimes can't find a just-uploaded site for a few seconds; retry once.
      - id: pages_try
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.pages_try.outcome == 'failure'
        run: sleep 30
      - id: pages_retry
        if: steps.pages_try.outcome == 'failure'
        uses: actions/deploy-pages@v5
