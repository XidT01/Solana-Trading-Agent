name: Scan

# GitHub's scheduler often runs cron jobs late or skips them, so instead of relying on it every
# 30 minutes, each run scans every 30 minutes for ~5 hours and then starts the next run itself.
# The cron below is only a backup that restarts the chain if it ever breaks.

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside the campaign dates"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # to start the website deploy and the next scan run

concurrency:
  group: agent-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      GH_TOKEN: ${{ github.token }}
      FORCE: ${{ inputs.force && '--force' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan every 30 minutes for ~5 hours
        run: |
          git config user.name "wallet-agent"
          git config user.email "wallet-agent@users.noreply.github.com"
          stop_at=$(( $(date +%s) + 5*3600 + 20*60 ))
          while :; do
            started=$(date +%s)
            python -m agent.scan $FORCE || echo "::warning::scan cycle failed"
            git add data
            if ! git diff --cached --quiet; then
              git commit -q -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
              if git pull -q --rebase -X theirs origin "$GITHUB_REF_NAME" && git push -q; then
                gh workflow run deploy.yml --ref "$GITHUB_REF_NAME" || echo "::warning::could not start deploy"
              else
                git rebase --abort 2>/dev/null || true
                echo "::warning::push failed; retrying next cycle"
              fi
            fi
            bash .github/keepalive.sh scan-evm.yml || true
            next=$(( started + 1800 ))
            [ "$next" -ge "$stop_at" ] && break
            wait=$(( next - $(date +%s) ))
            [ "$wait" -gt 0 ] && sleep "$wait"
          done
      - name: Start the next run
        if: always()
        run: |
          if python -c "import sys; from agent.common import load_config, utcnow; sys.exit(utcnow().date().isoformat() > load_config()['campaign']['end_date'])"; then
            gh workflow run scan.yml --ref "$GITHUB_REF_NAME"
          else
            echo "Campaign is over; not starting another run."
          fi
