name: Scan

on:
  schedule:
    # Every 30 minutes, around the clock. The agent checks the campaign dates in
    # config.yaml and exits outside them.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside the campaign dates"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: agent-data
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: python -m agent.scan ${{ inputs.force && '--force' || '' }}
      - name: Commit data
        run: |
          git config user.name "wallet-agent"
          git config user.email "wallet-agent@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

  deploy:
    needs: scan
    uses: ./.github/workflows/deploy.yml
