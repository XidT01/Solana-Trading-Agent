# Solana meme-coin "smart wallet" agent — all filters live here.

campaign:
  start_date: "2026-11-11"      # first day of the 30-day run (UTC)
  end_date: "2026-12-10"        # last day (inclusive)
  # Coins can hit $100K at any hour, so scans run around the clock.
  # To limit to peak hours instead, use e.g. [13, 23] (8am–6pm New York) and match the cron in scan.yml.
  scan_hours_utc: [0, 24]       # [start, end)

# Filter 1 — only launches from these platforms.
# The launch origin is read from the token's creation transaction on-chain:
#   pump.fun program            -> "pumpfun"
#   Raydium LaunchLab program   -> name of its platform config below (stonk.fun, letsbonk, ...)
#                                  or `unknown_launchlab_origin` (Raydium's own LaunchLab)
#   Meteora DBC program         -> "meteora-dbc"
#   otherwise                   -> dexId of the oldest pool (raydium, meteora, orca, ...)
# A token passes if any `allowed` entry is a substring of its origin.
launchpads:
  allowed: [pumpfun, raydium, meteora, stonk]
  programs:
    pumpfun: 6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P
    launchlab: LanMV9sAd7wArD4vJFi2qDdfnVhFxYSUg6eADduJ3uj
    meteora_dbc: dbcij3LWUppWqq96dh6gJWwBifmcGfLSB5D4DuSMaqN
  # stonk.fun runs on Raydium LaunchLab; each LaunchLab platform has its own platform-config account.
  launchlab_platforms:
    FfYek5vEz23cMkWsdJwG2oa6EphsvXSHrGpdALN4g6W1: letsbonk   # not in `allowed` -> filtered out
    6BwHHDg3u1854jC8PDLXvR4spTcLNaoBxLJNGC4nTESt: stonk      # stonk.fun (verified on-chain: "StonkFun", stonkfun.xyz)
  # Any other LaunchLab platform (e.g. Raydium's own) gets this label. Add more with: python -m agent.identify <mint>
  unknown_launchlab_origin: raydium-launchlab

discovery:
  geckoterminal_new_pool_pages: 5   # 20 pools per page
  use_dexscreener_profiles: true
  max_token_age_hours: 48           # only analyse fresh launches (chain history stays cheap)
  # Watchlist: young coins are re-checked every run until they reach the target or fizzle out.
  watch_drop_after_hours: 3         # ...stop watching a coin still under this mcap after 3h
  watch_drop_below_mcap_usd: 8000
  watchlist_max: 5000
  # Peak market cap comes from 15-min price candles (GeckoTerminal), so coins that hit $100K and
  # then dumped still count.
  peak_check_min_mcap_usd: 20000    # only fetch candles for coins currently above this
  max_peak_checks_per_run: 25
  max_tokens_per_run: 4             # wallet analysis is the expensive part
  max_tokens_per_day: 20            # ~1-2K RPC credits per coin -> ~1M/month (Helius free tier ~1M)

# Filter 2 — ignore honeypots, low liquidity and scams.
safety:
  min_liquidity_usd: 15000
  min_liquidity_to_mcap: 0.05       # liquidity must be >= 5% of market cap
  require_revoked_mint_authority: true
  require_revoked_freeze_authority: true   # freeze authority = classic Solana honeypot
  reject_token2022_extensions: [transferFeeConfig, transferHook, permanentDelegate, nonTransferable, defaultAccountState, pausableConfig]
  require_sells_in_24h: true        # buys but zero sells => probably can't sell
  max_rugcheck_score_normalised: 50 # RugCheck 0-100, higher = riskier
  reject_rugcheck_danger_risks: true
  max_top10_holder_pct: 35          # excluding AMM / bonding-curve accounts
  max_insider_network: 20           # RugCheck: reject coins with a linked-wallet network this big (insider farms)
  require_rugcheck: false           # if RugCheck is down, rely on on-chain checks only

# Filters 3 & 4 — which coins and wallets count.
wallets:
  target_mcap_usd: 100000           # only coins whose market cap peaked at $100K or more
  max_entry_mcap_usd: 30000         # wallets whose average entry was below $30K market cap
  min_multiple: 5                   # ...and made at least 5x; anything less is not tracked
  highlight_multiple: 10            # 10x+ wallets are tagged and called out separately
  min_hold_fraction_at_target: 0    # 0 = no holding rule (0.5 would require holding half the bag to $100K)
  pnl_mode: realised                # realised = only profits actually taken by selling count toward the multiple
                                    # (total would also count tokens still held at the current price; rugs
                                    #  make those look like 10-30x winners until they collapse)
  exclude_transfer_out: true        # wallets that pass tokens on to other wallets (bundle distribution) don't count
  min_buy_sol: 0.1                  # ignore dust buys
  exclude_creator: true             # dev wallet
  exclude_same_slot_as_launch: true # block-0 snipers / bundles
  max_early_txs: 2000               # first transactions read for early buyers (stops once past $15K mcap)
  max_candidates_per_token: 50
  max_txs_per_wallet: 60
  max_signature_pages: 200          # x1000 signatures (1 cheap call each); coins with more history are skipped

rpc:
  requests_per_second: 8            # Helius free tier allows ~10

report:
  ai_summary: true                  # needs ANTHROPIC_API_KEY
  model: claude-opus-5-5
  leaderboard_size: 25
  dashboard_url: https://xidt01.github.io/Solana-Trading-Agent/   # "Open dashboard" button in Telegram

# Anti-manipulation (all chains): a coin is rejected as a bundled launch when this many would-be winners all
# bought within this many seconds of launch.
integrity:
  bundle_window_seconds: 20
  bundle_min_wallets: 5

# ---------------------------------------------------------------- EVM chains
# Same coin and wallet rules as Solana (the `wallets:` section above). Trades are read from each token's
# Transfer logs on a free public RPC and priced with 1-minute GeckoTerminal candles, so PnL is in USD.
evm:
  max_tokens_per_run: 2             # per chain
  max_tokens_per_day: 15            # per chain
  max_transfer_logs: 150000         # coins with a longer history are skipped
  min_buy_usd: 10                   # ignore dust buys
  safety:
    max_tax_pct: 10
    require_security_scan: false    # Robinhood Chain has no honeypot scanner yet: rely on liquidity + sells checks
  chains:
    bsc:
      name: BSC
      chain_id: 56
      rpc: https://bsc-rpc.publicnode.com           # override with the EVM_RPC_BSC secret
      geckoterminal: bsc
      dexscreener: bsc
      honeypot_is: true
      log_chunk_blocks: 50000
      launchpads:
        allowed: [four.meme, flap]
        gt_dex: {four-meme: four.meme}
        contracts:
          "0x5c952063c7fc8610ffdb798152d69f0b9550762b": four.meme   # TokenManager (seen on four.meme launches)
          "0xe2ce6ab80874fa9fa2aae65d277dd6b8e65c9de0": flap        # Flap Portal
          "0x1de460f363af910f51726def188f9004276bf4bc": flap        # Flap launchpad
        suffixes: {"4444": four.meme, "7777": flap, "8888": flap}
    base:
      name: Base
      chain_id: 8453
      rpc: https://base-rpc.publicnode.com          # override with the EVM_RPC_BASE secret
      geckoterminal: base
      dexscreener: base
      honeypot_is: true
      log_chunk_blocks: 50000
      markets: ["0x498581ff718922c3f8e6a244956af099b2652b2b"]   # Uniswap v4 PoolManager
      launchpads:
        allowed: [clanker, zora, bankr, o1]
        gt_dex: {bankr: bankr, o1-launchpad: o1}
        contracts:
          "0xe85a59c628f7d27878aceb4bf3b35733630083a9": clanker     # Clanker v4 factory
          "0x777777751622c0d3258f214f9df38e35bf45baf3": zora        # Zora coin factory
          "0x53c59d8d335681d58f564cf62073fa3c57cf81ee": o1          # o1 tax-token factory (seen on PENNY)
        suffixes: {}
    robinhood:
      name: Robinhood
      chain_id: 4663
      rpc: https://rpc.mainnet.chain.robinhood.com  # override with the EVM_RPC_ROBINHOOD secret
      geckoterminal: robinhood
      dexscreener: robinhood
      honeypot_is: false
      log_chunk_blocks: 50000
      launchpads:
        allowed: [pons, pools.trade, long.xyz, launchpad.meme, o1]
        gt_dex:
          pons-dot-family: pons
          pons-v2: pons
          pons-v2-dex: pons
          uniswap-pools-trade: pools.trade
          long-xyz: long.xyz
          clanker-robinhood: clanker
          bankr-robinhood: bankr
          up-v3: up
          o1-launchpad-robinhood: o1
        contracts:
          "0xe33e9e479df8802cb0866d5d05258bec4cf62948": pons        # Pons V2 (seen on pons-v2 launches)
          "0xd3f2cc1731b7fd17f28798835c2e02f0a1839a94": clanker
        suffixes: {}
